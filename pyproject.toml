[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maple-gymnax"
version = "0.1.0"
description = "High-performance functional reinforcement learning simulator for MapleStory Lotus Phase 1 on JAX/XLA"
requires-python = ">=3.12"
dependencies = [
    "jax",
    "flax",
    "gymnax",
    "flashbax",
    "chex",
    "optax",
    "orbax-checkpoint",
    "jsonschema>=4.20.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/maple_gymnax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
